<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linear Regression Model · AQI Predictor</title>
  <meta name="description" content="Linear regression model trained on NN_DB.pdf data to predict PM2.5 from peak flow measurements. Page 4 standalone demo." />
  <link rel="stylesheet" href="./styles.css" />
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="./towns.js"></script>
  <script src="./api.js"></script>
  <script src="./advisory.js"></script>
  <script src="./demo.js"></script>
  <script src="./app1.js"></script>
  <script src="./regression.js"></script>
</head>
<body>
  <div id="root"><div class="boot">Loading linear regression model…</div></div>
  <header class="top pagehead">
    <div>
      <h1>AQI Predictor</h1>
      <div class="muted small">Linear regression model from NN_DB.pdf data</div>
    </div>
  </header>
  <div class="disclaimer">WARNING: This model was trained on limited synthetic data. Use predictions for educational purposes only.</div>
  <nav class="pnav">
    <a href="index.html">1 · Live forecast</a>
    <a href="map.html">2 · Topo map</a>
    <a href="advisor.html">3 · Health advisor</a>
    <a href="drive.html">4 · Drive</a>
    <a href="house.html">5 · My house</a>
    <a href="about.html">6 · About</a>
    <a href="scenarios.html">7 · Demo</a>
  </nav>
  <main>
    <div id="reg-content"></div>
  </main>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;
    const LinearRegression = window.LinearRegression;

    function RegressionApp() {
      const [pef, setPEF] = useState(372);
      const [prediction, setPrediction] = useState(null);
      const [accuracy, setAccuracy] = useState(null);
      const [trained, setTrained] = useState(false);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        // Model is already trained on module load (see regression.js)
        setTrained(LinearRegression.regressionTrained);
        setAccuracy(LinearRegression.getModelAccuracy());
        setLoading(false);
      }, []);

      const handlePredict = () => {
        const pred = LinearRegression.predictPM25(pef);
        setPrediction(pred);
      };

      return (
        <div className="reg-container">
          <div className="row space">
            <h2>Linear Regression Model</h2>
            <span className="badge" style={{ background: '#3b82f6', marginLeft: 8 }}>{trained ? 'Trained' : 'Not Trained'}</span>
          </div>

          <div className="card">
            <div className="row space">
              <label className="lbl">Peak Flow (PEF) in L/min:</label>
              <input
                type="range"
                min="319"
                max="430"
                value={pef}
                onChange={(e) => setPEF(parseInt(e.target.value))}
                className="input"
              />
              <span className="muted">{pef} L/min</span>
            </div>

            <div className="row space" style={{ marginTop: 16 }}>
              <button className="btn primary" onClick={handlePredict} disabled={loading}>
                {loading ? 'Calculating...' : 'Predict PM2.5'}
              </button>
            </div>

            {prediction !== null && (
              <div className="row space" style={{ marginTop: 16, background: '#dbeafe', padding: 12 }}>
                <span className="muted">Predicted PM2.5: </span>
                <span className="ok"><strong>{prediction.toFixed(2)} μg/m³</strong></span>
                <span className="muted"> (based on {pef} L/min peak flow)</span>
              </div>
            )}

            {accuracy !== null && (
              <div className="row space" style={{ marginTop: 12, fontSize: 0.875, color: '#64748b' }}>
                <div>Model R² accuracy: <b>{accuracy}%</b></div>
                <div className="muted">Slope: {LinearRegression.slope.toFixed(2)} PM2.5 per L/min</div>
                <div className="muted">Intercept: {LinearRegression.intercept.toFixed(2)} μg/m³</div>
              </div>
            )}
          </div>

          <div className="card" style={{ marginTop: 16, background: '#fef9c3', borderLeft: '4px solid #facc15' }}>
            <div className="muted" style={{ fontSize: 0.875 }}>
              <p><b>Training Data Summary (NN_DB.pdf):</b></p>
              <ul>
                <li>Patients 6-11 years old</li>
                <li>Control: PEFR 319-430 L/min, PM2.5 10.2-20.5 μg/m³</li>
                <li>Experiment: PEFR 328-417 L/min, PM2.5 4.5-14.2 μg/m³</li>
                <li>50 synthetic data points generated from summary statistics</li>
                <li>Linear model: PM2.5 = slope × PEF + intercept</li>
              </ul>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('reg-content'));
    root.render(<RegressionApp />);
  </script>
</body>
</html>
